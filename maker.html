<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صانع دعوة الزفاف</title><style>
:root{--gold:#b77c58;--ink:#5d514b}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px 12px;background:radial-gradient(circle at top,#fffdfb,#f1e1d5);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}main{max-width:720px;margin:auto;background:#fffdfa;border:1px solid #d9b9a3;border-radius:22px;padding:24px;box-shadow:0 14px 40px #8d6d5a22}h1{text-align:center;color:var(--gold);font-size:25px}p{text-align:center;line-height:1.8;color:#84746a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.wide{grid-column:1/-1}label{display:block;font-size:13px;margin-bottom:7px}input,textarea{font:inherit;width:100%;border:1px solid #d8c2b3;border-radius:9px;padding:12px;background:#fff;color:#443832;min-width:0}textarea{min-height:75px}button{font:inherit;border:0;border-radius:30px;padding:13px 18px;cursor:pointer}.primary{background:#c58e70;color:white;flex:1}.secondary{background:#f8eee7;color:#805c49}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.result{margin-top:18px;padding:15px;background:#f8eee7;border-radius:12px}.result[hidden]{display:none}.url{direction:ltr;text-align:left}.hint{font-size:12px}.back{text-align:center;font-size:12px;margin-top:18px}.back a{color:#986b50}@media(max-width:520px){main{padding:16px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.actions button{width:100%}}</style></head><body><main><h1>🌹 صانع دعوة الزفاف</h1><p>عمّر المعلومات واضغط على إنشاء الرابط. الموديل الأصلي يبقى بنفس التصميم.</p><form id="form"><div class="grid">
<div><label for="groom">اسم العريس</label><input id="groom" placeholder="اسم العريس" required></div><div><label for="bride">اسم العروس</label><input id="bride" placeholder="اسم العروس" required></div>
<div><label for="date">تاريخ العرس</label><input id="date" type="date" required></div><div><label for="time">الساعة</label><input id="time" type="time" value="20:00" required></div>
<div class="wide"><label for="venue">مكان الحفل</label><input id="venue" placeholder="قاعة الأفراح — وهران" required></div>
<div><label for="phone">رقم واتساب مع رمز البلد</label><input id="phone" type="tel" placeholder="+213..." required></div><div><label for="maps">رابط Google Maps (اختياري)</label><input id="maps" type="url" placeholder="https://maps.app.goo.gl/..."></div>
<div class="wide"><label for="message">رسالة إضافية (اختياري)</label><textarea id="message" placeholder="بكل حب وفرح، يشرفنا دعوتكم لمشاركتنا فرحتنا."></textarea></div></div><div class="actions"><button class="primary" type="submit">🔗 إنشاء رابط الزبون</button><button class="secondary" type="reset">مسح المعلومات</button></div></form>
<section class="result" id="result" hidden><label for="link">رابط الدعوة الجاهز</label><input class="url" id="link" readonly><div class="actions"><button class="primary" id="copy" type="button">نسخ الرابط</button><button class="secondary" id="open" type="button">معاينة الدعوة</button></div><p class="hint">الرابط يفتح الموديل الأصلي بمعلومات الزبون. المعلومات داخل الرابط ويمكن لمن يملكه رؤيتها.</p></section><div class="back"><a href="index.html">الرجوع إلى الموديل الأصلي</a></div></main>
<script>const $=id=>document.getElementById(id);$('form').addEventListener('submit',e=>{e.preventDefault();const u=new URL('index.html',location.href);u.search='';for(const k of ['groom','bride','date','time','venue','phone','maps','message']){const v=$(k).value.trim();if(v)u.searchParams.set(k,v)}$('link').value=u.href;$('result').hidden=false;$('link').focus();$('link').select()});$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('link').value);$('copy').textContent='تم النسخ ✓'}catch(e){$('link').focus();$('link').select();document.execCommand('copy');$('copy').textContent='انسخ الرابط المحدد'}});$('open').addEventListener('click',()=>{if($('link').value)window.open($('link').value,'_blank','noopener')});$('form').addEventListener('reset',()=>$('result').hidden=true);</script></body></html>
