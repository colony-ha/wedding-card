<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صانع دعوة الزفاف</title><style>
:root{--gold:#b77c58;--ink:#5d514b}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:radial-gradient(circle at top,#fffdfb,#f1e1d5);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}header{text-align:center;margin:4px auto 18px}h1{color:var(--gold);font-size:26px;margin:8px}header p{color:#84746a;line-height:1.8;margin:4px}.layout{max-width:1320px;margin:auto;display:grid;grid-template-columns:minmax(320px,410px) minmax(0,1fr);gap:18px;align-items:start}.panel{background:#fffdfa;border:1px solid #d9b9a3;border-radius:18px;padding:20px;box-shadow:0 12px 32px #8d6d5a1c;min-width:0}.panel h2{font-size:19px;margin:0 0 16px;color:#9b6e51}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-size:13px;margin-bottom:7px}input,textarea{font:inherit;width:100%;border:1px solid #d8c2b3;border-radius:9px;padding:11px;background:#fff;color:#443832;min-width:0}textarea{min-height:75px;resize:vertical}input:focus,textarea:focus{outline:2px solid #d9b9a3}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}button{font:inherit;border:0;border-radius:28px;padding:12px 16px;cursor:pointer}.primary{background:#c58e70;color:white;flex:1}.secondary{background:#f8eee7;color:#805c49}.preview-panel{position:sticky;top:12px}.preview-shell{border:1px solid #e7d4c8;border-radius:13px;overflow:hidden;background:#fff;min-height:600px}.preview-shell iframe{display:block;width:100%;height:760px;border:0;background:white}.result{margin-top:15px;padding:14px;background:#f8eee7;border-radius:12px}.result[hidden]{display:none}.url{direction:ltr;text-align:left}.hint{font-size:12px;line-height:1.7;color:#89796f}.back{text-align:center;font-size:12px;margin:20px}.back a{color:#986b50}@media(max-width:850px){body{padding:10px}.layout{grid-template-columns:1fr}.preview-panel{position:static;grid-row:2}.preview-shell iframe{height:720px}.panel{padding:15px}}@media(max-width:440px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}h1{font-size:22px}.preview-shell iframe{height:700px}}
</style></head><body><header><h1>🌹 صانع دعوة الزفاف</h1><p>عمّر المعلومات وشوف المعاينة تتبدل مباشرة، ومن بعد أنشئ رابط الزبون.</p></header>
<div class="layout"><section class="panel"><h2>📝 معلومات العروسين والحفل</h2><form id="form"><div class="grid">
<div><label for="groom">اسم العريس</label><input id="groom" placeholder="اسم العريس" required></div><div><label for="bride">اسم العروس</label><input id="bride" placeholder="اسم العروس" required></div>
<div><label for="date">تاريخ العرس</label><input id="date" type="date" value="2027-11-20" required></div><div><label for="time">الساعة</label><input id="time" type="time" value="20:00" required></div>
<div class="wide"><label for="venue">مكان الحفل</label><input id="venue" placeholder="قاعة الأفراح — وهران" required></div>
<div class="wide"><label for="phone">رقم واتساب مع رمز البلد</label><input id="phone" type="tel" placeholder="+213..." required></div>
<div class="wide"><label for="maps">رابط Google Maps (اختياري)</label><input id="maps" type="url" placeholder="https://maps.app.goo.gl/..."></div>
<div class="wide"><label for="message">رسالة إضافية (اختياري)</label><textarea id="message" placeholder="بكل حب وفرح، يشرفنا دعوتكم لمشاركتنا فرحتنا."></textarea></div></div>
<div class="actions"><button class="primary" type="submit">🔗 إنشاء رابط الزبون</button><button class="secondary" type="reset">مسح المعلومات</button></div></form>
<section class="result" id="result" hidden><label for="link">رابط الدعوة الجاهز</label><input class="url" id="link" readonly><div class="actions"><button class="primary" id="copy" type="button">نسخ الرابط</button><button class="secondary" id="open" type="button">فتح الدعوة</button></div><p class="hint">تقدر تقصّر الرابط قبل ما تبعثه. المعلومات موجودة داخل الرابط، وأي شخص يملكه يقدر يشوفها.</p></section></section>
<section class="panel preview-panel"><h2>👀 المعاينة المباشرة</h2><div class="preview-shell"><iframe id="preview" title="معاينة دعوة الزفاف"></iframe></div></section></div>
<div class="back"><a href="index.html">فتح الموديل الأصلي</a></div>
<script>
const $=id=>document.getElementById(id);
const keys=['groom','bride','date','time','venue','phone','maps','message'];
function makeUrl(){const u=new URL('index.html',location.href);u.search='';for(const k of keys){const v=$(k).value.trim();if(v)u.searchParams.set(k,v)}return u;}
function updatePreview(){const u=makeUrl();$('preview').src=u.href;}
let previewTimer;
document.querySelectorAll('#form input,#form textarea').forEach(el=>el.addEventListener('input',()=>{clearTimeout(previewTimer);previewTimer=setTimeout(updatePreview,180)}));
$('form').addEventListener('submit',e=>{e.preventDefault();$('link').value=makeUrl().href;$('result').hidden=false;});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('link').value);$('copy').textContent='تم النسخ ✓'}catch(e){$('link').focus();$('link').select();document.execCommand('copy');$('copy').textContent='انسخ الرابط المحدد'}});
$('open').addEventListener('click',()=>{if($('link').value)window.open($('link').value,'_blank','noopener')});
$('form').addEventListener('reset',()=>{setTimeout(()=>{$('result').hidden=true;updatePreview()},0)});
updatePreview();
</script></body></html>
